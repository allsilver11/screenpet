<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="form.css" />
    <style>
      body { gap: 5px; padding: 6px 10px; }
      #mine { font-size: 11px; color: #6b5a47; }
      #code { font-size: 26px; font-weight: 700; letter-spacing: 3px; user-select: text; }
      #hint { font-size: 11px; color: #6b5a47; }
      #input { font-size: 15px; letter-spacing: 1px; text-transform: uppercase; width: 140px; }
      #note { white-space: normal; }
      #note.bad { color: #b0503c; }
      #title.ask { font-size: 15px; font-weight: 700; }
      #ask { white-space: normal; }
      #who { font-size: 13px; }
      button:disabled { opacity: 0.5; cursor: default; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="title"></div>
    <div id="ask" hidden>스크린펫의 모든 데이터가 공유됩니다.</div>
    <div id="who" hidden></div>
    <div id="mineBox">
      <div id="mine">이 컴퓨터의 연결 코드 (10분 동안, 한 번만)</div>
      <div id="code"></div>
    </div>
    <div id="hint">저쪽 컴퓨터에서 이 코드를 넣거나, 저쪽 코드를 여기에 넣어요</div>
    <input id="input" placeholder="저쪽 코드" maxlength="12" autocomplete="off" spellcheck="false" />
    <div id="note"></div>
    <div id="buttons">
      <button id="ok" class="primary">연결</button>
      <button id="cancel">닫기</button>
    </div>
    <script src="common.js"></script>
    <script src="link.js"></script>
  </body>
</html>
