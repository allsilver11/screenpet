<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="form.css" />
    <style>
      #why, #later { font-size: 12px; width: 340px; line-height: 1.5; }
      #later { color: #8a7a66; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="title">📊 익명 펫 통계를 보낼까요?</div>
    <div id="hint">(키우는 펫 종류와 바꾼 횟수만, 하루에 한 번)</div>
    <div id="why">어떤 펫이 인기 있는지 알아보고, 새 펫을 만들 때 참고하려고 모아요. 누가 무엇을 골랐는지는 남지 않아요.</div>
    <div id="later">이름·친구·창 제목은 보내지 않아요. ⚙️ 설정의 "📊 익명 통계 보내기"로 언제든 바꿀 수 있어요.</div>
    <div id="buttons">
      <button id="yes" class="primary">보낼게요</button>
      <button id="no">안 보낼래요</button>
    </div>
    <script src="common.js"></script>
    <script src="stats_ask.js"></script>
  </body>
</html>
