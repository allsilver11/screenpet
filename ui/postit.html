<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="form.css" />
    <style>
      body { background: #ffe86e; color: #4b3d17; }
      #input { font-size: 13px; width: 260px; box-sizing: border-box; border-color: #c9a93f; border-radius: 4px; background: #fff8c8; }
      #count { font-size: 11px; color: #7a6526; min-height: 1em; }
      button { border-radius: 6px; border-color: #c9a93f; background: #fff8c8; }
      button.primary { background: #ffcf5a; border-color: #c9a93f; }
    </style>
  </head>
  <body>
    <div id="title">📝 던지기 전에 붙일 포스트잇 (읽으면 10초 뒤 사라져요)</div>
    <input id="input" autocomplete="off" spellcheck="false" placeholder="한 줄 쪽지" />
    <div id="count"></div>
    <div id="buttons">
      <button id="ok" class="primary">붙이기</button>
      <button id="cancel">닫기</button>
    </div>
    <script src="common.js"></script>
    <script src="postit.js"></script>
  </body>
</html>
