<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="form.css" />
    <link rel="stylesheet" href="list.css" />
    <style>
      #list { max-height: 430px; overflow-y: auto; }
      .letter.unread { border-color: #e88; background: #fff8f8; }
      .letter.unread .who { font-weight: bold; }
      .letter.done, .letter.rejected { opacity: 0.55; }
      .letter.done .text { text-decoration: line-through; text-decoration-color: #aaa; }
      .row label { font-size: 11px; display: flex; align-items: center; gap: 3px; cursor: pointer; }
      .row .status { display: flex; gap: 8px; margin-right: auto; }
      .row { display: flex; gap: 6px; justify-content: flex-end; }
      .row button { font-size: 11px; padding: 2px 8px; }
    </style>
  </head>
  <body>
    <div id="title">📮 건의함</div>
    <div id="empty">아직 건의가 없어요</div>
    <div id="list"></div>
    <div id="pager"></div>
    <div id="buttons">
      <button id="close">닫기</button>
    </div>
    <script src="common.js"></script>
    <script src="pager.js"></script>
    <script src="mailbox.js"></script>
  </body>
</html>
