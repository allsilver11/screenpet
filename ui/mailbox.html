<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="form.css" />
    <link rel="stylesheet" href="list.css" />
    <style>
      #list { max-height: 430px; overflow-y: auto; }
      .letter.unread { border-color: #e88; background: #fff8f8; }
      .letter.unread .who { font-weight: bold; }
      .letter.done, .letter.rejected { opacity: 0.55; }
      .badge.private { background: #eeeef6; color: #4a4a7a; }
      .letter.done .text { text-decoration: line-through; text-decoration-color: #aaa; }
      .row label { font-size: 11px; display: flex; align-items: center; gap: 3px; cursor: pointer; }
      .row .status { display: flex; gap: 8px; margin-right: auto; }
      .row { display: flex; gap: 6px; justify-content: flex-end; }
      .row button { font-size: 11px; padding: 2px 8px; }
      .photo { font-size: 11px; color: #8a7a66; margin: 4px 0; text-align: left; }
      .photo .thumb { max-width: 160px; max-height: 120px; border: 1px solid #c9b79f; border-radius: 6px; cursor: zoom-in; display: block; }
      #viewer { position: fixed; inset: 0; background: rgba(40, 32, 24, 0.85); display: none; align-items: center; justify-content: center; cursor: zoom-out; z-index: 10; }
      #viewer-img { max-width: 96%; max-height: 96%; border-radius: 6px; background: #fff; }
    </style>
  </head>
  <body>
    <div id="title">📮 건의함</div>
    <div id="empty">아직 건의가 없어요</div>
    <div id="list"></div>
    <div id="pager"></div>
    <div id="buttons">
      <button id="close">닫기</button>
    </div>
    <div id="viewer"><img id="viewer-img" alt="붙인 사진 크게" /></div>
    <script src="common.js"></script>
    <script src="pager.js"></script>
    <script src="photo.js"></script>
    <script src="mailbox.js"></script>
  </body>
</html>
