<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- 🌈 무지개 구름 자국 (src-tauri/src/trail.rs, ui/trail.js): 모니터 하나를 덮는 마우스 통과 투명 창.
         무지개 동물이 달릴 때만 있고, 구름이 다 사라지면 그림도 멈춘다.
         🖍️ 흐물이의 분필 낙서 (ui/doodle.js)도 같은 창 아래 캔버스에 그린다.
         🕷️ 거미인간의 줄과 모서리 거미집 (ui/web.js)은 그 사이 캔버스에 그린다.
         🦇 박쥐인간의 박쥐 신호 빛줄기 (ui/batsignal.js)는 맨 아래 캔버스에 그린다.
         ✨ 마법 효과 — ⚔️ 결투·⚡ 빛줄기·🐍 나기니·🦌 사슴·🥶 서리 (ui/magic.js)는 스니치 바로 아래 캔버스에 그린다.
         🟡 해리포터의 골든 스니치 (ui/snitch.js)는 맨 위 캔버스에 그린다. -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        pointer-events: none;
      }

      canvas {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="signal"></canvas>
    <canvas id="doodle"></canvas>
    <canvas id="web"></canvas>
    <canvas id="trail"></canvas>
    <canvas id="magic"></canvas>
    <canvas id="snitch"></canvas>
    <script src="opacity.js"></script>
    <script src="ready.js"></script>
    <script src="trail.js"></script>
    <script src="doodle.js"></script>
    <script src="web.js"></script>
    <script src="batsignal.js"></script>
    <script src="magic.js"></script>
    <script src="snitch.js"></script>
  </body>
</html>
