<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- 꿀벌이 쏜 침 자국 (spec 2B §10): 화면에 박힌 침(effects/sting.png) (글자 없음)
         10초 머문 뒤 1초 동안 흐려진다. 창은 마우스를 통과시키고, 다 사라지면 앱(decal.rs)이 닫는다. -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        pointer-events: none;
      }

      #decal {
        position: absolute;
        inset: 0;
        animation: fade 1s ease-in 10s forwards;
      }

      #mark,
      #fallback {
        position: absolute;
        left: 0;
        top: 0;
        width: 128px;
        height: 128px;
      }

      #fallback[hidden],
      #mark[hidden] {
        display: none;
      }


      @keyframes fade {
        to {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="decal">
      <!-- 그림이 없을 때: 가운데 침 끝 + 바깥으로 뻗은 금 -->
      <svg id="fallback" hidden viewBox="0 0 128 128">
        <g stroke="#e8e8ee" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9">
          <path d="M64 64 L22 40 M64 64 L104 30 M64 64 L112 76 M64 64 L82 112 M64 64 L30 104 M64 64 L16 70" />
          <path d="M40 50 L34 36 M92 40 L100 50 M90 98 L102 100" />
        </g>
        <path d="M58 58 L70 58 L64 74 Z" fill="#3a2a22" />
        <circle cx="64" cy="64" r="3" fill="#3a2a22" />
      </svg>
      <img id="mark" src="effects/sting.png" alt="" onerror="this.hidden = true; document.getElementById('fallback').removeAttribute('hidden')" />
    </div>
    <script>
      window.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
  </body>
</html>
