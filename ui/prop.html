<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- 밥그릇·물그릇·쿠키 (phase 3 먹이 바꾸기): 동물이 먹을 때 그 앞 바닥에 놓이는 소품.
         그림 이름은 앱(prop.rs)이 window.PROP_IMAGE로 넣어 준다 (effects/<name>.png). 톡 나타났다가,
         다 먹으면 앱이 body에 .hide를 붙여 0.6초 동안 흐려지고 창이 닫힌다. 창은 마우스를 통과시킨다.
         window.PROP_MODE = "hand" (직접 주기): 커서 끝에 붙은 음식 (effects/hand_*.png, 가운데 정렬, 살짝 흔들흔들).
         받아먹으면 .bite (냠 냠 두 번 베어 먹히며 사라짐), 거두면 .drop (툭 떨어지며 흐려짐). -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        pointer-events: none;
      }

      #prop {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: 50% 100%;
        transform-origin: 50% 100%;
        animation: pop 260ms ease-out both;
      }

      /* 눈덩이는 굴리는 동안 자란다 (brain_snow.rs ROLL_SECS), 눈사람은 톡 쌓인다 */
      #prop.snowball {
        animation: snowball 3s ease-out both;
      }

      @keyframes snowball {
        from {
          transform: scale(0.25);
        }
        to {
          transform: scale(1);
        }
      }

      #prop.snowman {
        animation: bloom 500ms ease-out both;
      }

      body.hand #prop {
        object-position: 50% 50%;
        transform-origin: 50% 50%;
        animation:
          pop 200ms ease-out both,
          dangle 1.6s ease-in-out 200ms infinite;
      }

      body.hand.bite #prop {
        animation: bite 800ms ease-in forwards;
      }

      body.hand.drop #prop {
        animation: drop 400ms ease-in forwards;
      }

      @keyframes dangle {
        0%,
        100% {
          transform: rotate(-6deg);
        }
        50% {
          transform: rotate(6deg);
        }
      }

      /* 냠 — 냠 — 사라짐: 베어 물 때마다 움찔 줄어든다 */
      @keyframes bite {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        20% {
          transform: scale(0.82, 0.9) rotate(-8deg);
        }
        35% {
          transform: scale(0.86) rotate(0deg);
        }
        55% {
          transform: scale(0.6, 0.7) rotate(8deg);
        }
        70% {
          transform: scale(0.62);
          opacity: 1;
        }
        100% {
          transform: scale(0.1);
          opacity: 0;
        }
      }

      @keyframes drop {
        to {
          transform: translateY(16px) rotate(20deg);
          opacity: 0;
        }
      }

      body.hide #prop {
        transition: opacity 600ms ease-in;
        opacity: 0;
      }

      @keyframes pop {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        70% {
          transform: scale(1.08);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes bloom {
        0% {
          transform: scale(0.1, 0.2);
          opacity: 0;
        }
        60% {
          transform: scale(0.9, 1.1);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      }

      /* 픽셀 스타일: 칸을 그대로, 확대·회전 없이 칸 단위 계단만 */
      body.pixel #prop,
      body.pixel #prop.snowman,
      body.pixel #prop.snowball {
        object-fit: fill;
        image-rendering: pixelated;
        animation: px-show 240ms step-end both;
      }
      @keyframes px-show {
        0% { opacity: 0; transform: translateY(3px); }
        50% { opacity: 1; transform: translateY(3px); }
        100% { opacity: 1; transform: none; }
      }
      body.pixel.hand #prop {
        animation:
          px-show 200ms step-end both,
          px-dangle 1.6s step-end 200ms infinite;
      }
      @keyframes px-dangle {
        0%, 100% { transform: none; }
        50% { transform: translateY(3px); }
      }
      /* 냠 — 냠: 아래부터 칸 줄을 뚝뚝 베어 먹는다 */
      body.pixel.hand.bite #prop {
        animation: px-bite 800ms step-end forwards;
      }
      @keyframes px-bite {
        0% { clip-path: inset(0); }
        25% { clip-path: inset(0 0 25% 0); }
        50% { clip-path: inset(0 0 50% 0); }
        75% { clip-path: inset(0 0 75% 0); }
        100% { clip-path: inset(0 0 100% 0); }
      }
      body.pixel.hand.drop #prop {
        animation: px-drop 400ms step-end forwards;
      }
      @keyframes px-drop {
        0% { transform: none; }
        25% { transform: translateY(3px); }
        50% { transform: translateY(6px); }
        75% { transform: translateY(9px); opacity: 1; }
        100% { transform: translateY(12px); opacity: 0; }
      }
      /* px-show의 opacity: 1이 남아 있으면 흐려지지 않는다 */
      body.pixel.hide #prop {
        animation: none;
        transition: opacity 600ms steps(3, end);
      }
    </style>
  </head>
  <body>
    <img id="prop" alt="" />
    <script src="prop.js"></script>
  </body>
</html>
