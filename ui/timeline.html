<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>🕐 최근 한 시간</title>
    <!-- 메뉴 🐾 내 펫 ▸ 🕐 최근 한 시간 (src-tauri/src/timeline.rs): 내 펫이 지난 한 시간 동안 어디에 있었고 무엇을 먹었는지. 내용은 timeline.js가 채운다 -->
    <style>
      html, body { margin: 0; }
      body {
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
        background: #fffaf2;
        color: #3b3024;
        font-size: 12px;
        line-height: 1.4;
        padding: 14px 14px 18px;
        box-sizing: border-box;
        user-select: none;
        word-break: keep-all;
      }
      h1 { font-size: 17px; margin: 0 0 2px; }
      h2 { font-size: 13px; margin: 14px 0 6px; }
      .sub { color: #8a7660; font-size: 12px; }
      .sub b { color: #3b3024; }
      /* 한 시간 막대: 왼쪽 = 한 시간 전, 오른쪽 = 지금. 기록이 없는 곳은 빗금 */
      .strip {
        position: relative;
        height: 22px;
        margin: 12px 0 0;
        border-radius: 6px;
        overflow: hidden;
        background: repeating-linear-gradient(135deg, #f3ead9 0 6px, #ece0ca 6px 12px);
        border: 1px solid #ecdcc4;
      }
      .strip > i { position: absolute; top: 0; bottom: 0; }
      /* 먹은 때: 막대 바로 아래 작은 이모지 */
      .bites { position: relative; height: 15px; }
      .bites > span { position: absolute; top: 1px; font-size: 10px; line-height: 1; transform: translateX(-50%); }
      .ticks { display: flex; justify-content: space-between; color: #a08c74; font-size: 10px; }
      .log { background: #fff; border: 1px solid #ecdcc4; border-radius: 10px; padding: 4px 8px; }
      .entry + .entry { border-top: 1px solid #f4ead8; }
      .dot { width: 10px; height: 10px; border-radius: 3px; }
      .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .foods { display: flex; flex-wrap: wrap; gap: 6px; }
      .foods > span { background: #fff; border: 1px solid #ecdcc4; border-radius: 999px; padding: 3px 9px; }
      .foods b { font-variant-numeric: tabular-nums; }
      .entry { display: grid; grid-template-columns: 82px 10px 1fr; gap: 7px; align-items: center; padding: 4px 0; }
      .entry .when { color: #8a7660; font-variant-numeric: tabular-nums; font-size: 11px; }
      .entry.meal .name { color: #8a7660; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>🕐 최근 한 시간</h1>
    <div class="sub" id="sum"></div>
    <div class="strip" id="strip"></div>
    <div class="bites" id="bites"></div>
    <div class="ticks"><span>1시간 전</span><span>30분 전</span><span>지금</span></div>
    <section id="food-box" hidden>
      <h2>먹은 것</h2>
      <div class="foods" id="foods"></div>
    </section>
    <h2>순서대로</h2>
    <div class="log" id="log"></div>
    <script src="common.js"></script>
    <script src="timeline.js"></script>
  </body>
</html>
