<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="form.css" />
    <style>
      #title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
      #input { font-size: 13px; width: 270px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="title">친구에게 펫과 함께 보낼 편지</div>
    <input id="input" maxlength="80" autocomplete="off" spellcheck="false" placeholder="한 줄 편지 (최대 80자)" />
    <div id="note"></div>
    <div id="buttons">
      <button id="ok" class="primary">보내기</button>
      <button id="cancel">닫기</button>
    </div>
    <script src="common.js"></script>
    <script src="letter.js"></script>
  </body>
</html>
