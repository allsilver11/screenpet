<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 펫과 머리 위 띠 (창 아래쪽에 붙어 있어 손님 편지 말풍선으로 창이 위로 커져도 그대로) -->
    <div id="stage">
      <div id="bubble" hidden></div>
      <div id="nametag" hidden></div>
      <div id="picker" hidden><button data-food="meal" title="밥">🍚</button><button data-food="favorite" id="fav">🐟</button></div>
      <div id="codetag" hidden title="눌러서 복사"></div>
      <div id="pet"></div>
      <div id="envelope" hidden title="편지">💌</div>
      <!-- 조작 모드 중 (방향키로 움직이는 중 — 친구 화면에 가 있는 내 동물도) -->
      <div id="ctltag" hidden title="조작 모드">🎮</div>
      <div id="heart">♥</div>
    </div>
    <script src="common.js"></script>
    <script src="main.js"></script>
  </body>
</html>
