<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 펫과 머리 위 띠 (창 아래쪽에 붙어 있어 손님 편지 말풍선으로 창이 위로 커져도 그대로) -->
    <div id="stage">
      <div id="bubble" hidden></div>
      <div id="nametag" hidden></div>
      <div id="picker" hidden><button data-food="meal" title="밥">🍚</button><button data-food="favorite" id="fav">🐟</button><button data-food="special" title="특식">🍱</button></div>
      <div id="codetag" hidden title="눌러서 복사"></div>
      <div id="pet">
        <!-- 졸린 시간의 수면 모자, 집중 진행 고리 (백엔드 pet-presence): #pet 안에 두어 몸의 모든 변환(반전·구르기·매달림·덜덜·뿅)을 그대로 받는다. 자리는 main.js + pet.json head -->
        <svg id="nightcap" hidden viewBox="0 0 34 26" width="34" height="26" aria-hidden="true">
          <g id="nightcap-art">
            <path d="M5 21 C7 10 15 3 26 6 C30 7 31 11 29 14 C27 11 24 10 22 11 C25 14 27 17 28 21 Z" fill="#6f86c9" stroke="#3f4f86" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M3 21 Q16 16 30 21 L30 25 Q16 20 3 25 Z" fill="#fff7e8" stroke="#3f4f86" stroke-width="1.2" stroke-linejoin="round" />
            <circle cx="29" cy="15" r="3.4" fill="#fff7e8" stroke="#3f4f86" stroke-width="1.2" />
          </g>
        </svg>
        <svg id="focusring" hidden viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
          <circle cx="10" cy="10" r="7.5" fill="#fffaf2cc" stroke="#d8c6ae" stroke-width="2.5" />
          <circle id="focusring-fill" cx="10" cy="10" r="7.5" fill="none" stroke="#ef8a5b" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 10 10)" />
        </svg>
      </div>
      <div id="envelope" hidden title="편지">💌</div>
      <!-- 조작 모드 중 (방향키로 움직이는 중 — 친구 화면에 가 있는 내 동물도) -->
      <div id="ctltag" hidden title="조작 모드">🎮</div>
      <!-- 눈사람의 작은 눈구름 (백엔드 render.cloud, 자리는 main.js placeCloud) -->
      <div id="snowcloud" hidden><i></i><i></i><i></i><i></i><i></i></div>
      <div id="heart">♥</div>
    </div>
    <script src="common.js"></script>
    <script src="main.js"></script>
  </body>
</html>
