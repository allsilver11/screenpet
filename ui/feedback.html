<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="form.css" />
    <style>
      #input { font-size: 13px; width: 330px; height: 150px; box-sizing: border-box; resize: none; font-family: inherit; }
      #count { font-size: 11px; color: #777; text-align: right; width: 330px; }
      #note { min-height: 1.4em; }
      #public { font-size: 11px; color: #8a7a66; width: 330px; }
      #photo-row { display: flex; align-items: center; gap: 8px; width: 330px; font-size: 11px; color: #8a7a66; }
      #photo-file { display: none; }
      #photo-box { position: relative; display: none; }
      #thumb { max-width: 96px; max-height: 64px; border: 1px solid #c9b79f; border-radius: 6px; display: block; }
      #photo-remove { position: absolute; top: -7px; right: -7px; padding: 0 5px; font-size: 10px; border-radius: 9px; }
    </style>
  </head>
  <body>
    <div id="title">💌 개발자에게 건의하기</div>
    <div id="hint">내 펫이 편지를 들고 개발자에게 가요. 하루에 5통까지 보낼 수 있어요.</div>
    <div id="public">보낸 편지의 첫 줄과 이름 첫 글자는<br>📮 건의함에서 다른 사용자에게도 보여요.</div>
    <textarea id="input" maxlength="1000" spellcheck="false" placeholder="추가하고 싶은 기능, 불편한 것, 하고 싶은 말을 적어 주세요"></textarea>
    <div id="count">0/1000자</div>
    <div id="photo-row">
      <input id="photo-file" type="file" accept="image/*" />
      <button id="photo-pick">📷 사진 붙이기</button>
      <div id="photo-box"><img id="thumb" alt="붙인 사진" /><button id="photo-remove" title="사진 빼기">✕</button></div>
      <span id="photo-hint">캡처는 Ctrl+V로 붙여도 돼요 (한 장)</span>
    </div>
    <div id="note"></div>
    <div id="buttons">
      <button id="ok" class="primary">보내기</button>
      <button id="cancel">닫기</button>
    </div>
    <script src="common.js"></script>
    <script src="photo.js"></script>
    <script src="feedback.js"></script>
  </body>
</html>
