<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
        background: #fffaf2;
        color: #3b3024;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 8px;
        white-space: nowrap;
        box-sizing: border-box;
        user-select: none;
        text-align: center;
      }
      #mine { font-size: 11px; display: flex; align-items: center; gap: 4px; }
      #code { font-size: 13px; font-weight: 700; letter-spacing: 1px; user-select: text; }
      #status { white-space: normal; font-size: 11px; color: #6b5a47; }
      #input {
        font: inherit;
        font-size: 15px;
        letter-spacing: 1px;
        text-align: center;
        text-transform: uppercase;
        width: 130px;
        padding: 4px 8px;
        border: 1px solid #c9b79f;
        border-radius: 8px;
        background: #fff;
      }
      #note { white-space: normal; font-size: 11px; color: #b0503c; min-height: 1em; }
      #buttons { display: flex; gap: 8px; }
      button {
        font: inherit;
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 8px;
        border: 1px solid #c9b79f;
        background: #fff;
        cursor: pointer;
      }
      button.primary { background: #ffcf8a; border-color: #e0a54f; font-weight: 600; }
      button:disabled { opacity: 0.5; cursor: default; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="mine">내 친구 코드 <span id="code">—</span> <button id="copy">복사</button> <button id="renew" title="예전 코드는 더 이상 쓸 수 없게 돼요">새 코드</button></div>
    <div id="status"></div>
    <input id="input" placeholder="ABCD-1234" maxlength="12" autocomplete="off" spellcheck="false" />
    <div id="note"></div>
    <div id="buttons">
      <button id="ok" class="primary">친구 신청</button>
      <button id="cancel">닫기</button>
    </div>
    <script src="common.js"></script>
    <script src="code.js"></script>
  </body>
</html>
