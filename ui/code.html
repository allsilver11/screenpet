<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
        background: #fffaf2;
        color: #3b3024;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px 12px;
        box-sizing: border-box;
        user-select: none;
        text-align: center;
      }
      #mine { font-size: 13px; display: flex; align-items: center; gap: 6px; }
      #code { font-size: 16px; font-weight: 700; letter-spacing: 1px; user-select: text; }
      #status { font-size: 12px; color: #6b5a47; }
      #input {
        font: inherit;
        font-size: 18px;
        letter-spacing: 2px;
        text-align: center;
        text-transform: uppercase;
        width: 150px;
        padding: 4px 8px;
        border: 1px solid #c9b79f;
        border-radius: 8px;
        background: #fff;
      }
      #note { font-size: 12px; color: #b0503c; min-height: 1em; }
      #buttons { display: flex; gap: 8px; }
      button {
        font: inherit;
        font-size: 13px;
        padding: 4px 12px;
        border-radius: 8px;
        border: 1px solid #c9b79f;
        background: #fff;
        cursor: pointer;
      }
      button.primary { background: #ffcf8a; border-color: #e0a54f; font-weight: 600; }
      button:disabled { opacity: 0.5; cursor: default; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="mine">내 친구 코드 <span id="code">—</span> <button id="copy">복사</button></div>
    <div id="status"></div>
    <input id="input" placeholder="ABCD-1234" maxlength="12" autocomplete="off" spellcheck="false" />
    <div id="note"></div>
    <div id="buttons">
      <button id="ok" class="primary">친구 신청</button>
      <button id="cancel">닫기</button>
    </div>
    <script src="common.js"></script>
    <script src="code.js"></script>
  </body>
</html>
