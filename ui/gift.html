<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- 바닥에 떨어진 선물 하나 (src-tauri/src/gifts.rs). 창이 그림 크기라 이 칸만 누를 수 있다. 그림 이름은 앱이 window.GIFT_IMAGE로
         넣어 준다 (gifts/<id>.png, 목록에 있는 값뿐이다). 누르면 앱에 알리고, 앱이 .collect를 붙인다 (반짝이며 위로 사라짐).
         30분이 지나면 .hide (흐려짐). 떨어지는 동안의 위치는 앱이 옮긴다. 가만히 있을 때 도는 애니메이션은 두지 않는다. -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      #gift {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        transform-origin: 50% 100%;
        animation: drop 420ms ease-out both;
        -webkit-user-drag: none;
      }

      #gift:hover {
        animation: wiggle 500ms ease-in-out;
      }

      @keyframes drop {
        0% {
          transform: scale(0.4);
          opacity: 0;
        }
        55% {
          transform: scale(1.12, 0.88);
          opacity: 1;
        }
        80% {
          transform: scale(0.95, 1.06);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes wiggle {
        25% {
          transform: rotate(-8deg);
        }
        75% {
          transform: rotate(8deg);
        }
      }

      body.hide #gift {
        transition: opacity 600ms ease-in;
        opacity: 0;
        pointer-events: none;
      }

      body.collect {
        pointer-events: none;
      }

      body.collect #gift {
        animation: rise 550ms ease-in forwards;
      }

      @keyframes rise {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        35% {
          transform: scale(1.2) translateY(-3px);
          opacity: 1;
        }
        100% {
          transform: scale(0.55) translateY(-30px);
          opacity: 0;
        }
      }

      .star {
        position: absolute;
        left: calc(50% - 6px);
        top: calc(50% - 6px);
        width: 12px;
        height: 12px;
        opacity: 0;
        background: #ffe680;
        clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      }

      body.collect .star {
        animation: burst 550ms ease-out forwards;
      }

      .star:nth-of-type(1) { --dx: -15px; --dy: -14px; }
      .star:nth-of-type(2) { --dx: 15px; --dy: -14px; animation-delay: 40ms !important; }
      .star:nth-of-type(3) { --dx: -16px; --dy: 8px; animation-delay: 80ms !important; }
      .star:nth-of-type(4) { --dx: 16px; --dy: 8px; animation-delay: 20ms !important; }
      .star:nth-of-type(5) { --dx: 0; --dy: -17px; animation-delay: 60ms !important; }

      @keyframes burst {
        0% {
          transform: translate(0, 0) scale(0.2);
          opacity: 1;
        }
        70% {
          opacity: 1;
        }
        100% {
          transform: translate(var(--dx), var(--dy)) scale(1) rotate(45deg);
          opacity: 0;
        }
      }

      /* 픽셀 스타일: 칸을 그대로, 찌그러짐·회전 없이 칸 단위 계단만 */
      body.pixel #gift {
        image-rendering: pixelated;
        animation: px-drop 300ms step-end both;
      }
      @keyframes px-drop {
        0% { opacity: 0; transform: translateY(-8px); }
        33% { opacity: 1; transform: translateY(-8px); }
        66% { opacity: 1; transform: translateY(-4px); }
        100% { opacity: 1; transform: none; }
      }
      body.pixel #gift:hover {
        animation: px-hop 400ms step-end;
      }
      @keyframes px-hop {
        0%, 100% { transform: none; }
        25%, 75% { transform: translateY(-4px); }
      }
      body.pixel.hide #gift {
        transition: opacity 600ms steps(3, end);
      }
      body.pixel.collect #gift {
        animation: px-rise 550ms step-end forwards;
      }
      @keyframes px-rise {
        0% { transform: none; opacity: 1; }
        25% { transform: translateY(-4px); opacity: 1; }
        50% { transform: translateY(-12px); opacity: 1; }
        75% { transform: translateY(-20px); opacity: 1; }
        100% { transform: translateY(-28px); opacity: 0; }
      }
      body.pixel .star {
        clip-path: none;
        background: url(effects_pixel/fx_spark2.png) 0 0 / 100% 100% no-repeat;
        image-rendering: pixelated;
      }
      body.pixel .star:nth-of-type(1) { --dx: -16px; --dy: -16px; }
      body.pixel .star:nth-of-type(2) { --dx: 16px; --dy: -16px; }
      body.pixel .star:nth-of-type(3) { --dx: -16px; --dy: 16px; }
      body.pixel .star:nth-of-type(4) { --dx: 16px; --dy: 16px; }
      body.pixel .star:nth-of-type(5) { --dx: 0px; --dy: -16px; }
      body.pixel.collect .star {
        animation: px-burst 550ms steps(4, end) forwards;
      }
      @keyframes px-burst {
        0% { transform: translate(0, 0); opacity: 1; }
        99% { opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <img id="gift" alt="" draggable="false" />
    <i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i>
    <script>
      const giftEl = document.getElementById("gift");
      // 스타일에 맞는 그림 (art-style: 떠 있는 동안 바뀌면 앱이 창 크기도 맞춘다)
      function applyArt(pixel) {
        document.body.classList.toggle("pixel", pixel);
        giftEl.src = `${pixel ? "gifts_pixel" : "gifts"}/${window.GIFT_IMAGE || "cat_yarn"}.png`;
      }
      applyArt(window.ART_STYLE === "pixel");
      const { invoke } = window.__TAURI__.core;
      window.__TAURI__.webviewWindow.getCurrentWebviewWindow().listen("art-style", (e) => applyArt(e.payload === "pixel"));
      let sent = false;
      window.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 || sent) return;
        sent = true;
        invoke("gift_collect");
      });
      window.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
  </body>
</html>
