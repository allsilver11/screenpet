<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
        background: #fffaf2;
        color: #3b3024;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px 12px;
        box-sizing: border-box;
        user-select: none;
        text-align: center;
      }
      #title { font-size: 13px; }
      #input {
        font: inherit;
        font-size: 16px;
        text-align: center;
        width: 200px;
        padding: 4px 8px;
        border: 1px solid #c9b79f;
        border-radius: 8px;
        background: #fff;
      }
      #note { font-size: 12px; color: #6b5a47; min-height: 1em; }
      #buttons { display: flex; gap: 8px; }
      button {
        font: inherit;
        font-size: 13px;
        padding: 4px 12px;
        border-radius: 8px;
        border: 1px solid #c9b79f;
        background: #fff;
        cursor: pointer;
      }
      button.primary { background: #ffcf8a; border-color: #e0a54f; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="title">친구들에게 보일 내 이름</div>
    <input id="input" maxlength="20" autocomplete="off" spellcheck="false" />
    <div id="note"></div>
    <div id="buttons">
      <button id="ok" class="primary">저장</button>
      <button id="cancel">닫기</button>
    </div>
    <script src="name.js"></script>
  </body>
</html>
