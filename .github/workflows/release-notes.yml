name: release notes

# docs/releases/<태그>.md를 고치면 이미 있는 릴리즈의 소개글을 맞춘다. 글만 바꾸고 첨부 파일은 건드리지 않는다.
on:
  push:
    branches: [main, feat/phase3]
    paths: ["docs/releases/**"]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update release bodies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 목록을 못 받으면 "릴리즈 없음"으로 건너뛰지 않고 실패한다
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          # 버전 순서로: 최신 릴리즈를 마지막에 고쳐 latest 표시가 옮겨 갈 일이 없게 한다
          for file in $(find docs/releases -maxdepth 1 -name 'v*.md' | sort -V); do
            tag=$(basename "$file" .md)
            if grep -Fxq -- "$tag" <<<"$releases"; then
              gh release edit "$tag" --notes-file "$file"
              echo "Updated $tag"
            else
              echo "Skipped $tag: no release"
            fi
          done
