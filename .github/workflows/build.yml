name: build

on:
  # 브랜치 푸시마다 돈다. 같은 저장소의 PR은 이 push가 이미 돌리니 pull_request는 포크 PR만 돈다 (아래 if)
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 작업 이름 test는 릴리즈가 찾는 check 이름이다: 바꾸거나 matrix로 만들면 안 된다
  test:
    # 태그는 브랜치 빌드에서 이미 테스트한 커밋에 다는 것이라 다시 돌리지 않는다 (릴리즈가 빨라진다)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Core tests
        run: cargo test --locked -p screenpet-core
      - name: Net tests
        run: cargo test --locked -p screenpet-net
      - name: Check Win32 code compiles
        run: cargo check --locked -p screenpet-core --target x86_64-pc-windows-gnu
      - name: Check macOS code compiles
        run: cargo check --locked -p screenpet-core --target aarch64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # UI 하네스 테스트는 node가 없으면 건너뛰어 버린다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sprite tool tests
        run: |
          pip install --require-hashes --only-binary :all: -r tools/requirements.txt
          cd tools && python -m pytest -q

  relay:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Relay tests
        run: cargo test --locked -p screenpet-relay
      - name: Check the net crate for Windows
        run: cargo check --locked -p screenpet-net --target x86_64-pc-windows-gnu
      - name: Build relay (Linux)
        run: cargo build --locked --release -p screenpet-relay
      - uses: actions/upload-artifact@v4
        with:
          name: screenpet-relay-linux
          path: |
            target/release/screenpet-relay
            deploy/relay/screenpet-relay.service
            deploy/relay/README.md

  windows:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || (startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'skipped')) }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack pet art as lossless WebP
        run: |
          pip install --require-hashes --only-binary :all: -r tools/requirements-pack.txt
          python tools/pack_webp.py
      - name: Build installers
        # PowerShell의 npm 스크립트가 --를 먹을 수 있어 bash로 돌린다 (--locked가 cargo까지 가야 한다)
        shell: bash
        run: npm run tauri build -- -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: screenpet-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  macos:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || (startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'skipped')) }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      # 서명 안 됨 — 처음 열 때 우클릭 → 열기 (README 참고)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack pet art as lossless WebP
        run: |
          pip install --require-hashes --only-binary :all: -r tools/requirements-pack.txt
          python tools/pack_webp.py
      - name: Build universal .dmg
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: screenpet-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
