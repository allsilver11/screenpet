name: build

on:
  # 브랜치 푸시마다 돈다. 같은 저장소의 PR은 이 push가 이미 돌리니 pull_request는 포크 PR만 돈다 (아래 if)
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 작업 이름 test는 릴리즈가 찾는 check 이름이다: 바꾸거나 matrix로 만들면 안 된다
  test:
    # 태그는 브랜치 빌드에서 이미 테스트한 커밋에 다는 것이라 다시 돌리지 않는다 (릴리즈가 빨라진다)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Core tests
        run: cargo test --locked -p screenpet-core
      - name: Net tests
        run: cargo test --locked -p screenpet-net
      - name: Crypto helper tests
        run: cargo test --locked -p screenpet-crypto
      - name: Check Win32 code compiles
        run: cargo check --locked -p screenpet-core --target x86_64-pc-windows-gnu
      - name: Check macOS code compiles
        run: cargo check --locked -p screenpet-core --target aarch64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # UI 하네스 테스트는 node가 없으면 건너뛰어 버린다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sprite tool tests
        run: |
          pip install --require-hashes --only-binary :all: -r tools/requirements.txt
          cd tools && python -m pytest -q

  relay:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Relay tests
        run: cargo test --locked -p screenpet-relay
      # ring의 빌드 스크립트는 cargo check에서도 C를 컴파일한다. 이 교차 검사에만 mingw gcc가 필요하고,
      # 리눅스 빌드는 러너의 gcc, Windows는 MSVC, macOS는 clang이 대상 아키텍처별로 맡는다
      - name: Install the Windows C compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: Check the net crate for Windows
        run: cargo check --locked -p screenpet-net --target x86_64-pc-windows-gnu
      - name: Build relay (Linux)
        run: cargo build --locked --release -p screenpet-relay
      - uses: actions/upload-artifact@v4
        with:
          name: screenpet-relay-linux
          path: |
            target/release/screenpet-relay
            deploy/relay/screenpet-relay.service
            deploy/relay/README.md

  # 읽기 토큰으로 빌드해 산출물만 올린다. 릴리즈에 붙이는 건 아래 release 작업이다
  build:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || (startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'skipped')) }}
    strategy:
      # 한쪽이 실패해도 다른 쪽 산출물은 받아 볼 수 있게. 릴리즈는 양쪽 다 성공해야 돈다
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: screenpet-windows
            rust-targets: ""
            tauri-args: ""
            installers: |
              target/release/bundle/nsis/*.exe
          # 서명 안 됨 — 처음 열 때 우클릭 → 열기 (README 참고)
          - os: macos-latest
            artifact: screenpet-macos
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles app,dmg
            installers: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack pet art as lossless WebP
        run: |
          pip install --require-hashes --only-binary :all: -r tools/requirements-pack.txt
          python tools/pack_webp.py
      - name: Build installers
        # PowerShell의 npm 스크립트가 --를 먹을 수 있어 bash로 돌린다 (--locked가 cargo까지 가야 한다)
        shell: bash
        run: npm run tauri build -- ${{ matrix.tauri-args }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installers }}
          if-no-files-found: error

  # 쓰기 토큰을 드는 유일한 작업이라 저장소 코드를 돌리지 않는다 (파일만 읽는다)
  release:
    needs: build
    # test가 건너뛰어진 태그 실행에서는 needs의 결과를 직접 물어야 이 작업이 돈다
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      checks: read
    steps:
      # 태그 실행의 test는 skipped로 같은 커밋에 남으니 "최근 것"이 아니라 전부에서 성공을 찾는다.
      # main과 태그를 같이 푸시하면 빌드가 test보다 먼저 끝나므로, 돌고 있으면 기다린다.
      - name: Verify the tagged commit passed the test job
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_MINUTES: 60
          POLL_SECONDS: 60
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=test&filter=all&per_page=100"
          deadline=$((SECONDS + WAIT_MINUTES * 60))
          while :; do
            counts=$(gh api "$api" --jq '[.check_runs[] | select(.app.slug == "github-actions")] | "\(map(select(.conclusion == "success")) | length) \(map(select(.status != "completed")) | length)"')
            read -r passed running <<<"$counts"
            if [ "$passed" -gt 0 ]; then
              echo "$GITHUB_SHA passed the test job."
              exit 0
            fi
            if [ "$running" -eq 0 ]; then
              echo "::error::$GITHUB_SHA has no successful test run, so nothing was released. Push this commit to a branch, wait for test to pass, then re-run this job."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The test job on $GITHUB_SHA did not finish within $WAIT_MINUTES minutes, so nothing was released. Re-run this job once test has passed."
              exit 1
            fi
            echo "test is still running on $GITHUB_SHA; waiting..."
            sleep "$POLL_SECONDS"
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ ! -s "docs/releases/$TAG.md" ]; then
            echo "::error::docs/releases/$TAG.md is missing or empty, so nothing was released. Add it, then tag a new commit."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: screenpet-windows
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: screenpet-macos
          path: dist/macos
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/**/*.exe
            dist/**/*.dmg
