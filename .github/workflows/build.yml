name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: cargo test -p screenpet-core
      - name: Check Win32 code compiles
        run: cargo check -p screenpet-core --target x86_64-pc-windows-gnu
      - name: Check macOS code compiles
        run: cargo check -p screenpet-core --target aarch64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sprite tool tests
        run: |
          pip install -r tools/requirements.txt
          cd tools && python -m pytest -q

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Relay tests
        run: cargo test -p screenpet-relay
      - name: Relay transport tests (in-process relay)
        run: cargo test -p screenpet-net --test relay
      - name: Check the net crate for Windows
        run: cargo check -p screenpet-net --target x86_64-pc-windows-gnu
      - name: Build relay (Linux)
        run: cargo build --release -p screenpet-relay
      - uses: actions/upload-artifact@v4
        with:
          name: screenpet-relay-linux
          path: |
            target/release/screenpet-relay
            deploy/relay/screenpet-relay.service
            deploy/relay/README.md

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build installers
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: screenpet-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  macos:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # 서명 안 됨 — 처음 열 때 우클릭 → 열기 (README 참고)
      - name: Build universal .dmg
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: screenpet-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
