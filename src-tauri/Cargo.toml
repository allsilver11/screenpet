[package]
name = "screenpet"
version = "0.6.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
# 🚀 컴퓨터 켜면 자동 실행 (Windows: Run 레지스트리, macOS: LaunchAgent)
tauri-plugin-autostart = "2"
# 🔄 업데이트: GitHub API·설치 파일 받기. screenpet-net과 같은 rustls(ring)+webpki-roots — TLS를 하나만 쓴다
ureq = { version = "3", default-features = false, features = ["rustls"] }
# 받은 설치 파일의 SHA-256 (GitHub asset digest와 견준다)
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
# 지역 날짜 (계절 날씨, weather.rs). Tauri가 이미 쓰는 판
chrono = { version = "0.4", default-features = false, features = ["clock"] }
screenpet-core = { path = "../crates/screenpet-core" }
screenpet-net = { path = "../crates/screenpet-net" }

# 떠 있는 창의 NSWindow collectionBehavior (overlay.rs). tao 0.37과 같은 objc2-app-kit 0.3
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
