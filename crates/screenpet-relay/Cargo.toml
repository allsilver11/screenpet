[package]
name = "screenpet-relay"
version = "0.1.0"
edition = "2021"
description = "ScreenPet relay: forwards end-to-end encrypted frames between friends over WebSocket"

[lib]
path = "src/lib.rs"

[[bin]]
name = "screenpet-relay"
path = "src/main.rs"

[dependencies]
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screenpet-crypto = { path = "../screenpet-crypto" }
# 앱과 같이 쓰는 와이어 메시지·버전·한도·날씨 지역 표
screenpet-proto = { path = "../screenpet-proto" }
curve25519-dalek = { version = "4.1", default-features = false }
# 📮 건의함: masked names are checked by graphemes, like the app cuts them
unicode-segmentation = "1"
# ☀️ Open-Meteo over HTTPS: the same ureq + rustls (ring) + webpki-roots the app uses. ring's build script compiles C.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Only for tests/downloads.rs (the app's update file names and URLs)
screenpet-core = { path = "../screenpet-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
