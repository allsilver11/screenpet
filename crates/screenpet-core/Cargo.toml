[package]
name = "screenpet-core"
version = "0.1.0"
edition = "2021"

[dependencies]
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ☀️ 날씨 지역 표·⚾ 랠리 상한: 릴레이·net과 같이 쓰는 값 (serde만 씀)
screenpet-proto = { path = "../screenpet-proto" }
# 🔄 업데이트 정보(latest.json)의 Ed25519 서명 확인 (순수 Rust — 모든 대상에서 빌드된다). 서명은 bin/screenpet-update-sign
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# 버전은 Tauri 2.12.5(tao 0.37)가 이미 쓰는 objc2 0.6 / 0.3 계열에 맞춘다
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSGeometry"] }
# NSRunningApplication·NSImage·NSGraphicsContext·NSImageRep·objc2-core-graphics: 📌 작업표시줄 장난감 — 앱 아이콘 읽기 (권한 없이)
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "objc2-core-foundation", "NSRunningApplication", "NSImage", "NSGraphicsContext", "NSImageRep", "objc2-core-graphics", "libc"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGGeometry",
    "CGRemoteOperation",
    "CGWindow",
    "CGImage",
    "CGContext",
    "CGBitmapContext",
    "CGColorSpace",
] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "objc2"] }
