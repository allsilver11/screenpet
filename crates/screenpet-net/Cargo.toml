[package]
name = "screenpet-net"
version = "0.1.0"
edition = "2021"

[dependencies]
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screenpet-crypto = { path = "../screenpet-crypto" }
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
curve25519-dalek = { version = "4.1", default-features = false }
blake2 = { version = "0.10", default-features = false }
# Relay transport: WebSocket over rustls with ring. ring's build script compiles C,
# so every target needs a C compiler, even for `cargo check` (windows-gnu: mingw gcc).
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# 📮 건의함: names and first lines are cut by graphemes (one emoji or Hangul syllable = one)
unicode-segmentation = "1"

[dev-dependencies]
socket2 = "0.6"
screenpet-relay = { path = "../screenpet-relay" }
# examples/ladder_bot: 결과 표를 그리려고 (앱과 같은 사다리 코드)
screenpet-core = { path = "../screenpet-core" }
